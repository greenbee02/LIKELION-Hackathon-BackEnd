spring:
  application:
    name: luxury-digital-card-collection
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-this-value-please-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
