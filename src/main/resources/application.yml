spring:
  application:
    name: luxury-digital-card-collection
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-this-value-please-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai:
    provider: ${AI_PROVIDER:openai}
    source-image-base-url: ${AI_SOURCE_IMAGE_BASE_URL:}
    worker:
      fixed-delay-ms: ${AI_WORKER_FIXED_DELAY_MS:5000}
      max-attempts: ${AI_WORKER_MAX_ATTEMPTS:3}
      retry-delay-ms: ${AI_WORKER_RETRY_DELAY_MS:10000}
      stale-timeout-ms: ${AI_WORKER_STALE_TIMEOUT_MS:900000}
    storage:
      path: ${AI_STORAGE_PATH:build/generated-ai-resources}
      public-base-url: ${AI_STORAGE_PUBLIC_BASE_URL:/generated/ai-resources}
    openai:
      enabled: ${AI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      model: ${OPENAI_IMAGE_MODEL:gpt-image-2}
      text-model: ${OPENAI_TEXT_MODEL:gpt-5-mini}
      size: ${OPENAI_IMAGE_SIZE:1024x1536}
      quality: ${OPENAI_IMAGE_QUALITY:low}
      background: ${OPENAI_IMAGE_BACKGROUND:auto}
      output-format: ${OPENAI_IMAGE_OUTPUT_FORMAT:png}
